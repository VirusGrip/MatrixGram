name: Windows checks and manual preview build
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "PROGRESS.md", "README.md"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: npm test
      - run: npm run check:policy
      - name: Check Windows identity and real installer hooks
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe") -and -not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          ./scripts/test-windows-integration.ps1
      - run: npm exec -w @matrixgram/client -- playwright install chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: MatrixGram-browser-failure
          path: apps/client/test-results/
          if-no-files-found: warn
      - run: cargo test --workspace --locked cache_load_100000_events -- --ignored --nocapture
      - run: npm run test:load
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MatrixGram-performance
          path: apps/client/performance-results/*.json
          if-no-files-found: warn
      - run: ./scripts/build-windows.ps1 -Unsigned
        if: github.event_name == 'workflow_dispatch'
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: MatrixGram-Windows-unsigned
          path: |
            target/release/matrixgram.exe
            target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
