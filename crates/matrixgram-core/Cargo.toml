[package]
name = "matrixgram-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
matrix-sdk = { version = "=0.19.1", default-features = false, features = ["sqlite", "bundled-sqlite", "e2e-encryption", "markdown"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "io-util", "net"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
zeroize = "1"
base64 = "0.22"
mime = "0.3"
sha2 = "0.10"
eyeball = "0.8"
matrix-sdk-crypto = "=0.19.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
tempfile = "3"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
wiremock = "0.6"
