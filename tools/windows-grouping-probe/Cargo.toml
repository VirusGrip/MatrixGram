[package]
name = "matrixgram-grouping-probe"
version = "0.1.0"
edition = "2024"
publish = false

# Independent of the Matrix SDK; builds only the Windows UI stack under test.
[workspace]

[profile.dev]
debug = 0

[target.'cfg(windows)'.dependencies]
tao = { version = "=0.37.2", default-features = false, features = ["rwh_06"] }
wry = { version = "=0.57.1", default-features = false, features = ["os-webview"] }
serde_json = "1"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
