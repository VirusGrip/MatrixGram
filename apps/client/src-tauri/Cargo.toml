[package]
name = "matrixgram"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "matrixgram_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
matrixgram-core = { path = "../../../crates/matrixgram-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
url = "2"
minisign-verify = "0.3"
reqwest = {version="0.13",default-features=false,features=["rustls-no-provider","stream"]}
tokio = { version = "1", features = ["sync", "time"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
base64 = "0.22"
tauri-plugin-opener = "2"
tokio-util = "0.7"
uuid = { version="1",features= ["v4"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
jni-tls = { package = "jni", version = "0.22" }
rustls-platform-verifier = "0.7.1"

[target.'cfg(any(windows, target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
